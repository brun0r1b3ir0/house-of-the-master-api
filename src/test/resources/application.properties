# Configuração usada SOMENTE nos testes.
# Este arquivo tem o mesmo nome do src/main/resources/application.properties e,
# como target/test-classes vem antes no classpath, ele substitui o principal por
# completo durante os testes: o .env e o Postgres de desenvolvimento não são lidos.
spring.application.name=api-test

spring.datasource.url=jdbc:h2:mem:hotm_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# No H2 o esquema vem das entidades; as migrations do Flyway são de Postgres
# e são testadas à parte, contra um Postgres real (MigrationsPostgresTest).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Chave fixa só para testes (Base64, 256 bits). Não usar em nenhum outro ambiente.
jwt.secret=PWDD6xK/IX66xh+SbSPywG8rvTupqPAnZXNIn9wLgJA=
jwt.expiration-ms=3600000
