spring.application.name=api

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}



# O esquema é criado pelas migrations do Flyway (src/main/resources/db/migration).
# O Hibernate só confere se as entidades batem com o banco.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log da ficha: edições do mesmo campo, pelo mesmo autor, dentro desta janela viram um evento só.
hotm.ficha.log.janela-juncao-segundos=30

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000